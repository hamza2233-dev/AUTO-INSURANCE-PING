<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Insurance Ping | Secure Agent Dispatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        dark: { 800: '#1f2937', 900: '#111827', 950: '#030712' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="h-full bg-dark-950 text-slate-200 flex flex-col selection:bg-primary-500/20">

    <!-- Header -->
    <header class="w-full py-4 px-6 md:px-10 border-b border-slate-800/50 bg-dark-950/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-xl bg-primary-600/10 border border-primary-500/20">
                    <svg class="w-6 h-6 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a4 4 0 014 4m-4-4a4 4 0 00-4 4m4-4v4m0 0a4 4 0 014 4m-4-4a4 4 0 00-4 4"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">Auto<span class="text-primary-500">Cover</span> Ping</h1>
            </div>
            <div class="flex items-center gap-2 text-sm font-medium text-slate-400">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                System Online
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 md:p-10 bg-[radial-gradient(#1f2937_1px,transparent_1px)] [background-size:16px_16px]">
        <div class="max-w-md w-full">
            
            <!-- Form Card -->
            <div class="glass-effect rounded-3xl p-8 md:p-10 shadow-[0_15px_40px_-5px_rgba(0,0,0,0.5)] border border-slate-700/50">
                
                <div class="text-center mb-10">
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary-500/10 border border-primary-500/20 text-primary-400 text-xs font-semibold mb-5 tracking-wide">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"></circle></svg>
                        RINGBA AGENT DISPATCH
                    </div>
                    <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tighter leading-tight">Connect instantly</h2>
                    <p class="text-slate-400 mt-3 text-base max-w-xs mx-auto">Enter the phone number below to dispatch the agent.</p>
                </div>

                <!-- Ping Form -->
                <form id="pingForm" class="space-y-6">
                    <div>
                        <label for="phone" class="block text-sm font-medium text-slate-300 mb-2">Caller ID (Phone Number)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            </div>
                            <input type="tel" name="phone" id="phone" required placeholder="+1 (555) 000-0000" 
                                class="input-focus w-full pl-12 pr-4 py-4 bg-dark-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-lg transition duration-150 focus:outline-none">
                        </div>
                        <p class="text-xs text-slate-500 mt-2.5 ml-1">Format: E.164 or national (e.g., 15550000000)</p>
                    </div>

                    <button type="submit" id="submitBtn" 
                        class="group w-full flex items-center justify-center gap-3 py-4 px-6 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-600 text-white font-bold rounded-xl shadow-lg shadow-primary-500/20 transition-all duration-200 transform active:scale-[0.98] text-lg disabled:opacity-70 disabled:cursor-not-allowed">
                        <span id="btnText">Dispatch Agent</span>
                        <svg id="btnLoader" class="w-5 h-5 animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <svg id="btnArrow" class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>

                <!-- Status Message -->
                <div id="responseMessage" class="hidden mt-8 text-center text-sm font-medium p-4 rounded-xl border animate-pulse"></div>

                <!-- Trust Signals -->
                <div class="mt-10 pt-6 border-t border-slate-800/50 text-center">
                    <p class="text-xs text-slate-600 uppercase tracking-wider font-medium mb-3">Secured Infrastructure</p>
                    <div class="flex justify-center items-center gap-6 grayscale opacity-50">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_Firebase_logo.svg" alt="Firebase" class="h-5">
                        <img src="https://www.vectorlogo.zone/logos/ringba/ringba-official.svg" alt="Ringba" class="h-5">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8e/Nextjs-logo.svg" alt="Next.js" class="h-5">
                    </div>
                </div>

            </div>
            
            <!-- Sub Footer -->
            <p class="text-center text-xs text-slate-600 mt-8">Internal tool authorized personnel only. &copy; 2024 AutoCover Technologies.</p>
            
        </div>
    </main>

    <!-- Link external JS -->
    <script src="ping.js"></script>
</body>
</html>
