<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Insurance Ping</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans antialiased text-slate-100 flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950">

    <div class="max-w-md w-full mx-4 bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl shadow-2xl p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Auto Insurance Ping</h1>
            <p class="text-slate-400 text-xs mt-1">Enter your phone number to dispatch caller ID.</p>
        </div>

        <!-- Ping Form -->
        <form id="pingForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Caller ID (Phone Number)</label>
                <input type="tel" name="phone" id="phone" required placeholder="(555) 000-0000" 
                    class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg shadow-blue-500/25 transition">
                Send Ping
            </button>
        </form>

        <!-- Status Message -->
        <div id="responseMessage" class="hidden mt-4 text-center text-xs font-medium p-3 rounded-lg"></div>

    </div>

    <!-- Link external JS -->
    <script src="ping.js"></script>
</body>
</html>
